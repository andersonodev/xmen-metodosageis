{% extends "base.html" %}
{% load static %}

{% block title %}Nova Habilidade - Sistema Ágil{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Cadastrar nova habilidade</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="skill-name">Nome</label>
                    <input type="text" id="skill-name" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="skill-category">Categoria</label>
                    <select id="skill-category" name="category" class="form-select" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="skill-description">Descrição</label>
                    <textarea id="skill-description" name="description" class="form-control" rows="4"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" href="{% url 'skills:list' %}">Cancelar</a>
                    <button class="btn btn-primary" type="submit">Salvar habilidade</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
